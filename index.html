<!DOCTYPE html>
<!-- 로보락 데스크탑 펫 V1.9 : 파일 어질러 놓기 = 카드 셔플 후 던지기 애니메이션, 파일끼리 충돌 시 밀려나 겹치지 않음 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로보락 데스크탑 펫 V1.9</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg1:#e6eaec;--bg2:#f5f7f8;--ink:#1d282c;--panel:#fffffff0;--line:#0000001f;--sh:#0000002e;--s1:#e6e8ea;--s2:#b7bcc0;--acc:#1f9d6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#12181b;--bg2:#1c2326;--ink:#e8eff1;--panel:#263034f0;--line:#ffffff2e;--sh:#0009}}
:root[data-theme="dark"]{--bg1:#12181b;--bg2:#1c2326;--ink:#e8eff1;--panel:#263034f0;--line:#ffffff2e;--sh:#0009}
html,body{height:100%;margin:0}
body{font:14px 'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:var(--bg1);overflow:hidden}
#desk{position:relative;height:100%;background:linear-gradient(var(--bg2),var(--bg1));touch-action:none;user-select:none}
.tg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 0 6px}
.wb{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px;width:calc(50% - 4px)}
.wb span{display:block;width:100%;aspect-ratio:16/9;border-radius:6px;border:1px solid var(--line)}
.dt{position:absolute;left:0;top:0;z-index:1;pointer-events:none}
.dt.st{border-radius:50% 45% 55% 48%;background:radial-gradient(circle,var(--c) 0,var(--c) 40%,transparent 72%);opacity:.7}
.dt.pp{width:13px;height:13px;border-radius:50%;background:#f3f1ea;border:1.5px solid #b9b4a6;box-shadow:0 1px 2px var(--sh)}
.dt.wr{width:16px;height:9px;border-radius:3px;background:var(--c);box-shadow:0 1px 2px var(--sh)}
#wet{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1;pointer-events:none}
.dt.gone{transition:opacity .6s ease-out,filter .6s ease-out;opacity:0!important;filter:blur(4px)}
/* 반짝이(물걸레 모드가 아닐 때) */
.sp{position:absolute;z-index:4;pointer-events:none;background:linear-gradient(135deg,#fff6b0,#ffb800);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:sp .8s ease-out forwards}
@keyframes sp{0%{transform:scale(0) rotate(0);opacity:0}30%{opacity:1}100%{transform:scale(1.3) rotate(90deg);opacity:0}}


.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 8px var(--sh)}
#hud{position:absolute;left:14px;top:14px;padding:9px 12px;min-width:176px;z-index:7}
#hud i{display:block;height:5px;border-radius:3px;background:var(--line);margin:6px 0 4px;overflow:hidden}
#hud i b{display:block;height:100%;background:var(--acc)}
#hud small{opacity:.75}
.file{position:absolute;left:0;top:0;width:76px;text-align:center;font-size:11px;line-height:1.2;touch-action:none;cursor:grab;z-index:3}
.file.drag{cursor:grabbing;z-index:8;filter:drop-shadow(0 6px 6px var(--sh))}
.file:hover{z-index:4}
.file.busy{pointer-events:none}
.file i{display:block;width:34px;height:42px;margin:0 auto 3px;border-radius:4px 10px 4px 4px;background:#fff;border:1px solid #0000001a;position:relative}
.file i::after{content:attr(data-e);position:absolute;left:-1px;right:-1px;bottom:5px;font:700 9px/1.5 sans-serif;color:var(--c);background:none}
.file i::before{content:"";position:absolute;left:-1px;right:-1px;bottom:5px;height:13px;background:var(--c);opacity:.9}
.file i::after{color:#fff;z-index:1}
.file b{font-weight:400;padding:1px 5px;border-radius:6px;background:var(--panel);color:var(--ink);display:inline-block;box-sizing:border-box;max-width:76px;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;line-height:1.25;vertical-align:top}
#tg{position:absolute;right:22px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:20px;z-index:3}
.tg{width:92px;text-align:center;font-size:12px}
.tg .ic{width:70px;height:52px;margin:0 auto 5px;border-radius:5px 10px 7px 7px;background:#f0c24f;position:relative;box-shadow:0 2px 6px var(--sh)}
.tg .ic::before{content:"";position:absolute;left:0;top:-8px;width:28px;height:10px;border-radius:5px 5px 0 0;background:inherit}
.tg[data-k=img] .ic{background:#e98aa3}.tg[data-k=etc] .ic{background:#8fa3b3}
.tg[data-k=trash] .ic{background:#9aa5ab;border-radius:4px 4px 10px 10px;width:50px;height:56px;cursor:pointer}
.tg[data-k=trash] .ic::before{left:-6px;top:-8px;width:62px;height:7px;border-radius:3px}
.tg.full .ic{background:#d9604f}
#dock{position:absolute;left:22px;bottom:70px;width:112px;height:116px;z-index:2}
#dock svg{width:100%;height:100%;filter:drop-shadow(0 4px 6px var(--sh))}
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;padding:8px 12px;z-index:7;border-radius:0;border-width:1px 0 0;flex-wrap:wrap}
.btn{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:9px;padding:6px 11px;cursor:pointer}
.btn:hover{background:var(--line)}
.btn:focus-visible,.sw:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn[aria-pressed=true],.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn:disabled{opacity:.45;cursor:default}
#bot{position:absolute;left:0;top:0;width:72px;height:72px;z-index:5;cursor:pointer;will-change:transform}
#bot.hot #rot svg{filter:drop-shadow(0 0 9px var(--acc))}
#bot.fol #rot svg{filter:drop-shadow(0 4px 4px var(--sh)) drop-shadow(0 0 6px var(--acc))}
#sh,#rot,#rot svg{width:100%;height:100%;display:block}
#rot svg{filter:drop-shadow(0 4px 4px var(--sh))}
.strain #sh{animation:sh .18s infinite}
@keyframes sh{0%,100%{transform:translate(0)}25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
@media (prefers-reduced-motion:reduce){.strain #sh{animation:none}}
#bub{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);white-space:nowrap;background:#fff;color:#1d282c;font-size:12px;padding:5px 10px;border-radius:12px;box-shadow:0 2px 6px var(--sh);opacity:0;transition:opacity .2s;pointer-events:none}
#bub.on{opacity:1}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0004;z-index:20}
#modal.on{display:flex}
#mc{width:min(340px,88vw);padding:18px}
#mc h2{margin:0 0 8px;font-size:16px;font-weight:400}
#mc p{margin:0 0 12px;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
/* V1.4 잠긴 스킨 */
.swi{display:flex;flex-direction:column;align-items:center;gap:4px;width:48px;font-size:11px;line-height:1.2;text-align:center}
.swi .need{color:#c0533f;font-weight:700;display:flex;align-items:center;gap:2px}
.sw.lk{position:relative;cursor:not-allowed;filter:grayscale(.75) brightness(.92)}
.sw.lk::after{content:"";position:absolute;inset:-2px;border-radius:50%;background:repeating-linear-gradient(45deg,#0000 0 4px,#00000030 4px 6px)}
.sw .lock{position:absolute;right:-7px;bottom:-7px;width:18px;height:18px;z-index:1;filter:drop-shadow(0 1px 2px var(--sh));animation:wig 3.2s ease-in-out infinite;transform-origin:50% 30%}
@keyframes wig{0%,84%,100%{transform:rotate(0)}88%{transform:rotate(-16deg)}92%{transform:rotate(14deg)}96%{transform:rotate(-8deg)}}
.sw.shk{animation:shk .45s}
.sw.shk .lock{animation:lb .45s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes lb{0%,100%{transform:scale(1)}40%{transform:scale(1.45) rotate(-12deg)}70%{transform:scale(.95) rotate(8deg)}}
#hint{margin:10px 0 0;padding:8px 10px;border-radius:9px;background:var(--line);font-size:12px;line-height:1.5}
#hint.on{background:#fbe3dd;color:#7a2c1f;animation:pop .35s ease-out}
#hint i{display:block;height:5px;border-radius:3px;background:#0000001f;margin-top:6px;overflow:hidden}
#hint i b{display:block;height:100%;background:#d9604f;transition:width .5s}
@keyframes pop{0%{transform:scale(.94);opacity:.4}60%{transform:scale(1.03);opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.sw .lock,.sw.shk,.sw.shk .lock,#hint.on{animation:none}}
</style>
</head>

const BG=['linear-gradient(#222d31,#12181b)','linear-gradient(#f7f9fa,#e3e8ea)',"url('"+IMG[0]+"') center/cover","url('"+IMG[1]+"') center/cover"];
let dirts=[],dn=0,wp=matchMedia('(prefers-color-scheme:dark)').matches?0:1;
/* ===== V1.6 물걸레 자국 (V1.5에서 물결 무늬만 제거) =====
   로봇 뒤쪽(걸레 위치)을 따라 젖은 자국이 남고 약 1.5초 동안 서서히 마름.
   배경화면별 표현: 0 어두운 = 빛 반사(광택), 1 밝은 = 물 색(하늘색),
                   2 평면도·3 산 = 배경을 살짝 굴절시켜 비치는 투명한 물 */
const WLIFE=1500,dpr=Math.min(devicePixelRatio||1,2);
const cv=document.createElement('canvas');cv.id='wet';desk.prepend(cv);const wc=cv.getContext('2d');
const wMask=document.createElement('canvas'),wMc=wMask.getContext('2d');      // 굴절용 마스크
const wBg=document.createElement('canvas'),wBc=wBg.getContext('2d');let wBgOk=0; // 배경 사본
let trail=[],wetOn=0;
const WT=[
  {m:'gloss',band:'180,225,255',bandA:.10,line:'190,232,255',lineA:.55,hi:'255,255,255',hiA:.65},
  {m:'water',band:'70,160,225',bandA:.16,line:'30,128,205',lineA:.62,hi:'255,255,255',hiA:.9},
  {m:'refr'},{m:'refr'}];
function wetSize(){[cv,wMask,wBg].forEach(c=>{c.width=Math.round(W*dpr);c.height=Math.round(H*dpr)});wetBg()}
function wetBg(){
  wBgOk=0;if(wp<2||!W)return;const im=new Image(),k=wp;
  im.onload=()=>{if(k!==wp)return;const s=Math.max(W/im.width,H/im.height),w=im.width*s,hh=im.height*s;
    wBc.setTransform(dpr,0,0,dpr,0,0);wBc.clearRect(0,0,W,H);wBc.drawImage(im,(W-w)/2,(H-hh)/2,w,hh);wBgOk=1};
  im.src=IMG[wp-2];
}
function wetPush(){
  const x=bt.x-Math.sin(bt.h)*18,y=bt.y+Math.cos(bt.h)*18,l=trail[trail.length-1],d=l?Math.hypot(x-l.x,y-l.y):0;
  if(l&&d<1.5)return;
  trail.push({x,y,t:performance.now(),s:l&&d<30?l.s+d:0,b:!l||d>=30});
}
// 자국 그리기: band=젖은 자국 폭(line을 넘기면 물결 줄도 그리지만 V1.6에서는 사용 안 함)
function wetDraw(c,now,col,lw,off){
  const P=trail,n=P.length,N=[];
  for(let i=0;i<n;i++){const a=P[Math.max(0,i-1)],b=P[Math.min(n-1,i+1)];let dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1;N.push([-dy/l,dx/l])}
  const al=i=>{const a=1-(now-P[i].t)/WLIFE;return a<=0?0:a*a*(3-2*a)};
  if(col.band){for(let i=1;i<n;i++){if(P[i].b)continue;const A=al(i);if(!A)continue;const p=P[i-1],q=P[i],u=N[i-1],v=N[i],r=21;
    c.fillStyle=col.band(A);c.beginPath();c.moveTo(p.x+u[0]*r,p.y+u[1]*r);c.lineTo(q.x+v[0]*r,q.y+v[1]*r);c.lineTo(q.x-v[0]*r,q.y-v[1]*r);c.lineTo(p.x-u[0]*r,p.y-u[1]*r);c.fill()}}
  if(!col.line)return;c.lineWidth=lw;c.lineCap='round';
  for(let j=-1;j<=1;j++){
    const w=i=>{const p=P[i],age=(now-p.t)/WLIFE,o=j*12+off+(2.4+age*1.6)*Math.sin(p.s/3.4+j*1.9-now/170);return[p.x+N[i][0]*o,p.y+N[i][1]*o]};
    for(let i=1;i<n;i++){if(P[i].b)continue;const A=al(i);if(!A)continue;
      if(j&&Math.sin(P[i].s/38+j*2.3)>.8)continue; // 바깥 줄은 군데군데 끊겨 자연스럽게
      const a=w(i-1),b=w(i);c.strokeStyle=col.line(A);c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke()}
  }
}
function drawWet(now){
  while(trail.length&&now-trail[0].t>WLIFE)trail.shift();
  if(!trail.length&&!wetOn)return;
  wc.setTransform(dpr,0,0,dpr,0,0);wc.clearRect(0,0,W,H);wetOn=trail.length>1;if(!wetOn)return;
  const T=WT[wp];
  if(T.m==='refr'&&wBgOk){
    // 1) 마스크에 물 자국 모양을 그림  2) 배경 사본을 살짝 어긋나게(굴절) 그려 마스크 모양만 남김  3) 밝게 + 하이라이트
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;trail.forEach(p=>{x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y)});
    x0-=30;y0-=30;x1+=30;y1+=30;
    wMc.setTransform(dpr,0,0,dpr,0,0);wMc.clearRect(x0,y0,x1-x0,y1-y0);
    wetDraw(wMc,now,{band:A=>'rgba(255,255,255,'+(A*.55)+')'},4,0);
    wc.save();wc.beginPath();wc.rect(x0,y0,x1-x0,y1-y0);wc.clip();
    wc.setTransform(1,0,0,1,0,0);wc.drawImage(wBg,3*dpr,2.5*dpr);
    wc.globalCompositeOperation='destination-in';wc.drawImage(wMask,0,0);
    wc.globalCompositeOperation='source-atop';wc.fillStyle='rgba(255,255,255,.13)';wc.fillRect(0,0,cv.width,cv.height);
    wc.restore();wc.setTransform(dpr,0,0,dpr,0,0);
    wetDraw(wc,now,{band:A=>'rgba(30,70,110,'+(A*.05)+')'},0,0);              // 아주 옅은 젖은 기운
  }else{
    const t=T.m==='refr'?WT[1]:T;
    wetDraw(wc,now,{band:A=>'rgba('+t.band+','+(A*t.bandA)+')'},2.2,0);
  }
}
const R=e=>{const r=e.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}};

}
const put=(f,s=1,r=0)=>f.el.style.transform='translate('+(f.x-38)+'px,'+(f.y-30)+'px) scale('+s+')'+(r?' rotate('+r+'deg)':'');
const near=f=>Math.hypot(f.x-bt.x,f.y-bt.y)<52;
function mk(d,x,y){
  const el=document.createElement('div');el.className='file';
  el.innerHTML='<i data-e="'+d.e+'" style="--c:'+C[d.e]+'"></i><b title="'+d.n+'">'+d.n.replace(/_/g,'_<wbr>').replace(/\(/g,'<wbr>(')+'</b>';desk.appendChild(el);
  const f={...d,el,x,y};files.push(f);put(f);
  el.onpointerdown=e=>{act();drag=f;f.ox=e.clientX-f.x;f.oy=e.clientY-f.y;el.setPointerCapture(e.pointerId);el.classList.add('drag')};
  el.onpointermove=e=>{if(drag!==f)return;f.x=e.clientX-f.ox;f.y=e.clientY-f.oy;put(f);bot.classList.toggle('hot',near(f))};
  el.onpointerup=()=>{if(drag!==f)return;drag=null;el.classList.remove('drag');bot.classList.remove('hot');if(near(f))ask(f)};
  return f;
}
function mess(n,anim){
  const taken=files.map(f=>f.fly?{x:f.fly.tx,y:f.fly.ty}:f),list=[];
  for(let i=0;i<n;i++){const[a,b,c]=FT[Math.floor(Math.random()*FT.length)],p=spot(taken);taken.push(p);
    const f=mk({n:a,e:b,t:c},p.x,p.y);list.push({f,tx:p.x,ty:p.y})}
  if(anim){const r=$('[data-a=mess]').getBoundingClientRect();throwFiles(list,{x:r.left+r.width/2,y:r.top-58})}
}
/* ===== V1.9 파일 던지기(셔플 → 흩뿌리기) + 파일 충돌 =====
   · '파일 어질러 놓기': 버튼 위로 카드 더미가 튀어나와 두 번 섞이고(리플 셔플), 한 장씩 포물선을 그리며 회전하며 목적지까지 날아가 착지
   · 충돌: 쉬고 있는 파일끼리 겹치면 매 프레임 조금씩 밀어내 겹침을 없앰(드래그 중인 파일은 고정, 다른 파일이 밀려남) */
const FBW=76,FPAD=6;                          // 파일 칸 폭 + 최소 간격
const fbh=f=>f.bh||(f.bh=f.el.offsetHeight||66);
function clampF(f){f.x=Math.max(42,Math.min(W-150,f.x));f.y=Math.max(36,Math.min(H-128,f.y))}
// 겹치지 않는 착지 지점 고르기(무작위 후보 중 다른 파일과 가장 멀리 떨어진 곳)
function spot(taken){
  let best=null,bd=-1;
  for(let k=0;k<30;k++){let x=90+Math.random()*(W-330),y=110+Math.random()*(H-300);if(x<190&&y>H-260)x+=220;
    let d=1e9;for(const p of taken)d=Math.min(d,Math.max(Math.abs(p.x-x)/(FBW+FPAD),Math.abs(p.y-y)/80));
    if(d>=1)return{x,y};if(d>bd){bd=d;best={x,y}}}
  return best;
}
function collide(){
  const L=files.filter(f=>!f.fly&&f!==bt.carry),mv=new Set();
  for(let it=0;it<2;it++)for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){
    const a=L[i],b=L[j],ma=a===drag?0:1,mb=b===drag?0:1;if(!ma&&!mb)continue;
    const ha=fbh(a),hb=fbh(b),ox=FBW+FPAD-Math.abs(a.x-b.x),oy=Math.min(a.y+ha,b.y+hb)-Math.max(a.y,b.y)+FPAD;
    if(ox<=0||oy<=0)continue;
    // 두 파일 중심을 잇는 방향으로 밀어냄(완전히 겹치면 무작위 방향) → 한쪽 벽에 막혀도 옆으로 퍼짐
    let dx=a.x-b.x,dy=a.y+ha/2-b.y-hb/2;if(Math.abs(dx)<.5&&Math.abs(dy)<.5){const t=Math.random()*6.283;dx=Math.cos(t);dy=Math.sin(t)}
    const ux=dx/(FBW+FPAD),uy=dy/((ha+hb)/2+FPAD),l=Math.hypot(ux,uy)||1,d=.3/(ma+mb),px=ux/l*ox*d,py=uy/l*oy*d;
    a.x+=px*ma;a.y+=py*ma;b.x-=px*mb;b.y-=py*mb;
    if(ma){clampF(a);mv.add(a)}if(mb){clampF(b);mv.add(b)}
  }
  mv.forEach(f=>put(f));
}
// 던지기 애니메이션: list=[{f,tx,ty}], D=카드 더미 위치
function throwFiles(list,D){
  const now=performance.now(),n=list.length;
  list.forEach((o,k)=>{const f=o.f;
    f.fly={k,n,D,tx:o.tx,ty:o.ty,t0:now,sh:900,dl:k*110,spin:(Math.random()<.5?-1:1)*(360+Math.random()*360),dur:0,land:0};
    f.busy=true;f.el.classList.add('busy');f.el.style.zIndex=9;f.x=D.x;f.y=D.y;put(f,.2);});
}
function flyStep(){
  const now=performance.now();
  for(const f of files){const F=f.fly;if(!F)continue;const t=now-F.t0,D=F.D,half=F.k%2?1:-1;
    if(F.land){ // 착지 후 살짝 눌렸다 복귀
      const u=Math.min(1,(now-F.land)/180);put(f,1+.1*Math.sin(Math.PI*u));
      if(u>=1){f.fly=null;f.busy=false;f.el.classList.remove('busy');f.el.style.zIndex='';put(f)}
      continue}
    const sy=D.y-F.k*1.6; // 더미에서 쌓인 높이
    if(t<F.sh){ // 1) 등장 + 셔플(두 번 갈라졌다 합쳐짐)
      const ap=Math.min(1,t/180),v=Math.max(0,(t-180)/(F.sh-180)),sp=Math.abs(Math.sin(2*Math.PI*v));
      f.x=D.x+half*32*sp;f.y=sy-6*sp;
      f.el.style.zIndex=9+(v<.5?F.k:(F.k*7+3)%F.n); // 섞이면서 위아래 순서가 바뀜
      put(f,.2+.8*(1-Math.pow(1-ap,3)),half*9*sp);continue}
    const tt=t-F.sh-F.dl;
    if(tt<0){f.x=D.x;f.y=sy;put(f,1,0);continue}   // 2) 차례 기다리기
    if(!F.dur){F.dist=Math.hypot(F.tx-D.x,F.ty-sy);F.dur=Math.min(1050,420+F.dist*.75);F.sy=sy;f.el.style.zIndex=20}
    const u=Math.min(1,tt/F.dur),e=1-Math.pow(1-u,3),arc=Math.min(170,F.dist*.4)*4*u*(1-u);
    f.x=D.x+(F.tx-D.x)*e;f.y=F.sy+(F.ty-F.sy)*e-arc;   // 3) 포물선 + 회전 비행
    put(f,1+.2*Math.sin(Math.PI*u),F.spin*(1-e));
    if(u>=1){f.x=F.tx;f.y=F.ty;F.land=now;f.el.style.zIndex=9}
  }
}

function enqueue(list){
  const batch=[];
  list.forEach(([f,to])=>{f.busy=true;f.el.classList.add('busy');tasks.push({f,to});batch.push({d:{n:f.n,e:f.e,t:f.t},to,x:f.x,y:f.y})});
  hist.push(batch);act();
}
const show=(t,b)=>{$('#mt').textContent=t;$('#mb').innerHTML=b;$('#modal').classList.add('on')};
const close=()=>$('#modal').classList.remove('on');
function ask(f){pend=f;show('어디로 보낼까요?','<p>'+f.n+'.'+f.e.toLowerCase()+'</p><div class="row">'+Object.keys(TG).map(k=>'<button class="btn" data-a="send" data-v="'+k+'">'+TG[k]+'</button>').join('')+'<button class="btn" data-a="close">취소</button></div>')}
function askEmpty(){show('휴지통 비우기','<p>파일 '+trash+'개를 영구 삭제해요. 비우면 되돌릴 수 없어요.</p><div class="row"><button class="btn pri" data-a="empty">로보락이 비우기</button><button class="btn" data-a="close">나중에</button></div>')}
const LOCK='<svg class="lock" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="8.5" fill="#1d282c"/><path d="M6.3 8V6.6a2.7 2.7 0 0 1 5.4 0V8" fill="none" stroke="#fff" stroke-width="1.5"/><rect x="5" y="8" width="8" height="5.6" rx="1.3" fill="#ffc94d"/><circle cx="9" cy="10.6" r=".9" fill="#1d282c"/></svg>';
function custom(){
  const L=lvl(),lockN=SK.filter(s=>L<s[3]).length;
  show('로보락 꾸미기','<p>스킨</p><div class="row">'+SK.map((s,i)=>{const lk=L<s[3],bg='background:linear-gradient(135deg,'+s[1]+','+s[2]+')';
    return '<div class="swi">'+(lk
      ?'<button class="sw lk" aria-disabled="true" aria-label="'+s[0]+' (잠김, Lv.'+s[3]+' 필요)" title="Lv.'+s[3]+'에 열려요" data-a="lockskin" data-v="'+i+'" style="'+bg+'">'+LOCK+'</button>'+s[0]+'<span class="need">Lv.'+s[3]+'</span>'
      :'<button class="sw" aria-label="'+s[0]+'" aria-pressed="'+(skin===i)+'" data-a="skin" data-v="'+i+'" style="'+bg+'"></button>'+s[0])+'</div>'}).join('')
  +'</div>'+(lockN?'<p id="hint">자물쇠가 달린 스킨은 레벨을 올리면 열려요.</p>':'')
  +'<p style="margin-top:12px">액세서리</p><div class="row">'+AC.map(a=>'<button class="btn" aria-pressed="'+!!acc[a[0]]+'" '+(L<a[2]?'disabled':'data-a="acc" data-v="'+a[0]+'"')+'>'+a[1]+(L<a[2]?' · Lv.'+a[2]:'')+'</button>').join('')+'</div><p style="margin-top:14px"><button class="btn" data-a="close">닫기</button></p>');
}
function sweep(){const p=[];let d=0;for(let y=50;y<H-60;y+=58){d?p.push([W-40,y],[40,y]):p.push([40,y],[W-40,y]);d^=1}return p}
const acts={
  close,
  send(k){close();enqueue([[pend,k]])},
  clean(){const L=files.filter(f=>!f.busy);if(!L.length)return say('정리할 파일이 없어요');const n={doc:0,img:0,etc:0};L.forEach(f=>n[f.t]++);show('바탕화면 청소','<p>파일 '+L.length+'개를 종류별 폴더로 옮길게요.<br>문서 '+n.doc+' · 이미지 '+n.img+' · 기타 '+n.etc+'</p><p>승인하면 시작하고, 끝난 뒤에도 되돌릴 수 있어요.</p><div class="row"><button class="btn pri" data-a="go">승인하고 시작</button><button class="btn" data-a="close">취소</button></div>')},
  go(){close();enqueue(files.filter(f=>!f.busy).map(f=>[f,f.t]))},
  undo(){
    if(tasks.length||bt.carry)return say('작업이 끝난 뒤에 되돌릴 수 있어요',2200);
    const b=hist.pop();if(!b)return say('되돌릴 작업이 없어요');
    b.forEach(e=>{mk(e.d,e.x,e.y);e.to==='trash'?trash--:cnt[e.to]--});upd();say('되돌렸어요 ('+b.length+'개)');
  },
  mess(){mess(6,true);say('또 어질러졌네요…')},
  mop(){mop=!mop;$('#mopb').setAttribute('aria-pressed',mop);if(mop){spawnDirt(26);bt.pts=sweep();bt.si=0;say('물걸레 모드! 쓰레기와 얼룩을 치울게요',2400);bt.st='idle';bt.wait=20}else{clearDirt();say('물걸레 모드를 껐어요')};upd()},
  custom,
  wp(){const N=['어두운','밝은','평면도','산'];show('배경화면','<div class="row">'+N.map((n,i)=>'<button class="btn wb" aria-pressed="'+(wp===i)+'" data-a="setwp" data-v="'+i+'"><span style="background:'+BG[i]+'"></span>'+n+'</button>').join('')+'</div><p style="margin-top:12px"><button class="btn" data-a="close">닫기</button></p>')},
  setwp(i){wp=+i;wall();acts.wp()},
  skin(i){skin=+i;look();custom()},
  lockskin(i){
    const s=SK[+i],need=LV[s[3]-2],left=need-xp,el=$('.sw[data-v="'+i+'"]'),hn=$('#hint');
    el.classList.remove('shk');void el.offsetWidth;el.classList.add('shk');
    if(hn){hn.classList.remove('on');void hn.offsetWidth;hn.classList.add('on');
      hn.innerHTML='<b>'+s[0]+'</b> 스킨은 <b>Lv.'+s[3]+'</b>부터 쓸 수 있어요. 파일 <b>'+left+'개</b>만 더 정리하면 열려요!<i><b style="width:0"></b></i>';
      requestAnimationFrame(()=>requestAnimationFrame(()=>hn.querySelector('i b').style.width=Math.min(100,xp/need*100)+'%'))}
  },
  acc(k){acc[k]=!acc[k];look();custom()},
  empty(){close();bt.emp=1}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a&&acts[a.dataset.a]){act();acts[a.dataset.a](a.dataset.v)}});
function unlock(){const L=lvl(),m={2:['rib','리본과 로즈 스킨이 열렸어요'],3:['gl','선글라스가 열렸어요'],4:['hat','베레모가 열렸어요']}[L];if(m){acc[m[0]]=1;look();say('레벨업! '+m[1],3200)}}
function arrive(t){
  const f=t.f;tasks.shift();bt.carry=null;f.el.remove();files=files.filter(o=>o!==f);
  t.to==='trash'?trash++:cnt[t.to]++;
  const b=lvl();xp++;upd();
  if(lvl()>b)unlock();else say(t.to==='trash'?'휴지통에 쏙':TG[t.to]+' 폴더에 넣었어요',1200);
  if(trash<6)bt.asked=0;
  if(trash>=6&&!bt.asked){bt.asked=1;setTimeout(askEmpty,500)}
  bt.st='idle';bt.wait=15;
}
function face(dx,dy){let d=Math.atan2(dx,-dy)-bt.h;d=Math.atan2(Math.sin(d),Math.cos(d));bt.h+=d*.18;if(bt.h>Math.PI)bt.h-=2*Math.PI;if(bt.h<-Math.PI)bt.h+=2*Math.PI}
function go(x,y,s){const dx=x-bt.x,dy=y-bt.y,d=Math.hypot(dx,dy);if(d<=s){bt.x=x;bt.y=y;return 1}face(dx,dy);bt.x+=dx/d*s;bt.y+=dy/d*s}
function decide(){
  if(mop&&dirts.length&&bt.si<bt.pts.length){bt.st='sweep';return}
  if(performance.now()-last>15000){bt.st='toDock';return}
  if(lvl()>=3&&Math.random()<.35){bt.st='chase';bt.ch=170;say('어디 가세요? 따라갈래요!',1500);return}
  bt.tp={x:90+Math.random()*(W-330),y:90+Math.random()*(H-260)};bt.st='wander';
}
function tick(){
  const px=bt.x,py=bt.y,s=bt.st,T=tasks[0];
  if(s==='idle'){if(T)bt.st='toFile';else if(bt.emp)bt.st='toTrash';else if(bt.fol)bt.st='follow';else if(--bt.wait<=0)decide()}
  else if(s==='follow'){if(T)bt.st='toFile';else if(bt.emp)bt.st='toTrash';else if(!bt.fol){bt.st='idle';bt.wait=40}else{const d=Math.hypot(mouse.x-bt.x,mouse.y-bt.y);if(d>46)go(mouse.x,mouse.y,d>260?3.6:2.8);if(--bt.talk<=0){bt.talk=480+Math.random()*300;if(d>120)say(FL[Math.floor(Math.random()*FL.length)],1600)}}}
  else if(s==='toFile'){if(!T)bt.st='idle';else if(go(T.f.x,T.f.y,3.4)){bt.carry=T.f;T.f.el.style.zIndex=6;bt.st='toTarget';say('배달 갑니다!',900)}}
  else if(s==='toTarget'){const p=tpos(T.to);if(go(p.x,p.y,3))arrive(T)}
  else if(s==='toTrash'){const p=tpos('trash');if(go(p.x,p.y,3)){bt.st='dump';bt.ch=70;say('끄응… 비우는 중',1500)}}
  else if(s==='dump'){if(--bt.ch<=0){trash=0;bt.emp=0;bt.asked=0;hist=hist.filter(b=>!b.some(e=>e.to==='trash'));upd();say('휴지통을 비웠어요');bt.st='idle';bt.wait=40}}
  else if(s==='wander'){if(T)bt.st='toFile';else if(go(bt.tp.x,bt.tp.y,2.2)){bt.st='idle';bt.wait=50+Math.random()*90}}
  else if(s==='chase'){if(T)bt.st='toFile';else{go(mouse.x,mouse.y,2.6);if(--bt.ch<=0){bt.st='idle';bt.wait=30}}}
  else if(s==='sweep'){if(T)bt.st='toFile';else{const p=bt.pts[bt.si];if(!p||!dirts.length){bt.st='toDock';say('물걸레 끝! 반짝반짝',2500)}else if(go(p[0],p[1],3.2))bt.si++}}
  else if(s==='toDock'){if(T)bt.st='toFile';else{const p=dockPos();if(go(p.x,p.y,2.6)){bt.st='sleep';led.setAttribute('fill','#f2b84b');say('충전 중… zzz',2200)}}}
  else if(s==='sleep')bt.h*=.9;
  if(bt.carry){const f=bt.carry;f.x=bt.x;f.y=bt.y-2;put(f,.72)}
  flyStep();collide();
  fr++;
  if(mop&&bt.st!=='sleep'){
    for(let i=dirts.length-1;i>=0;i--){const d=dirts[i];if(Math.hypot(d.x-bt.x,d.y-bt.y)<42){const el=d.el;el.classList.add('gone');setTimeout(()=>el.remove(),650);dirts.splice(i,1);upd()}}
    if(px!==bt.x||py!==bt.y)wetPush();
  }else if(!mop&&bt.st!=='sleep'&&fr%8===0&&(px!==bt.x||py!==bt.y))spark(bt.x-Math.sin(bt.h)*32+(Math.random()-.5)*26,bt.y+Math.cos(bt.h)*32+(Math.random()-.5)*26,10+Math.random()*6); // !물걸레: 반짝이
  if(fr%60===0){
    const free=files.filter(f=>!f.busy).length;
    if(free<8)bt.offered=0;
    else if(!bt.offered&&(bt.st==='sleep'||bt.st==='idle')){bt.offered=1;wake();say('파일이 많아졌어요. ‘청소 시작’을 눌러 주세요',4500)}
  }
  bot.classList.toggle('strain',bt.st==='dump'||(trash>=6&&bt.st==='idle'));
  bot.style.transform='translate('+(bt.x-36)+'px,'+(bt.y-36)+'px)';rot.style.transform='rotate('+bt.h+'rad)';
  
}
function follow(){
  bt.fol=!bt.fol;act();bot.classList.toggle('fol',!!bt.fol);
  if(bt.fol){if(!tasks.length&&!bt.carry&&!bt.emp&&bt.st!=='dump')bt.st='follow';bt.talk=420;say('따라갈게요! 그만하려면 저를 두 번 눌러 주세요',2800)}
  else{if(bt.st==='follow'){bt.st='idle';bt.wait=40}say('알겠어요, 여기서 기다릴게요',2000)}
  upd();
}
// 한 번 클릭: 대사 / 두 번 클릭(350ms 이내, 마우스·터치 공통): 따라가기 시작·종료
let tapT=0,tapTm;
$('#sh').addEventListener('click',()=>{
  act();const n=performance.now();clearTimeout(tapTm);
  if(n-tapT<350){tapT=0;follow();return}
  tapT=n;tapTm=setTimeout(()=>say(['간지러워요!','파일은 제가 옮길게요','바닥도 바탕화면도 맡겨 주세요','집에서도, 컴퓨터에서도','두 번 누르면 따라다닐게요'][Math.floor(Math.random()*5)]),260);
});
bot.addEventListener('pointermove',()=>{if(drag)return;if(++pet>30){pet=0;act();say('좋아요… ♥',1600)}});
desk.addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
addEventListener('resize',size);
setInterval(()=>say('오래 일했어요. 잠깐 쉬어요',3500),90000);
size();look();wall();
$('#tg').innerHTML=Object.keys(TG).map(k=>'<div class="tg" data-k="'+k+'"><div class="ic"></div>'+TG[k]+' <span></span></div>').join('');
$('.tg[data-k=trash]').onclick=()=>{if(trash)askEmpty()};
mess(9);upd();
{const d=dockPos();bt.x=d.x;bt.y=d.y;led.setAttribute('fill','#f2b84b')}
let pt=0,ft=0;
function loop(t){ft+=Math.min(t-pt,100);pt=t;while(ft>=16.67){ft-=16.67;tick()}drawWet(performance.now());requestAnimationFrame(loop)}
requestAnimationFrame(loop);
